name: Update versions

on:
  schedule:
    # Every 6 hours at 05:00, 11:00, 17:00, 23:00 UTC.
    # The 05:00 slot lands at 07:00 CEST (summer) / 06:00 CET (winter) and
    # also re-reads SNAPSHOT dates (see "Fetch publication dates").
    - cron: '0 5 * * *'
    - cron: '0 11,17,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'versions-lib.js'
      - '.github/workflows/update-versions.yml'

permissions:
  contents: write

concurrency:
  group: update-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # No actions/setup-node: ubuntu-latest ships a current Node, and the
      # script only uses stable built-ins (fetch, node:fs). Skipping it keeps a
      # manual "Run workflow" round trip as short as possible.
      - uses: actions/checkout@v4

      - name: Fetch maven metadata
        run: node --version && node scripts/fetch-versions.mjs

      # Incremental: only versions not cached in data/dates yet. Releases come
      # from the Nexus search API (swept when many are missing), SNAPSHOTs
      # from their own metadata, at most 400 single lookups per run. The
      # daily 05:00 run also re-reads every cached SNAPSHOT. Never --full here:
      # a full refresh is a manual, local step.
      - name: Fetch publication dates
        env:
          SNAPSHOTS: ${{ github.event.schedule == '0 5 * * *' && '--snapshots' || '' }}
        run: node scripts/fetch-dates.mjs --max 400 $SNAPSHOTS

      # Incremental: only POMs not cached in data/deps yet, at most 150 per
      # run, so the initial backfill spreads over many runs. Also rebuilds
      # data/deps/mps-jbr.json (MPS version -> JBR build).
      - name: Fetch POM dependencies
        run: node scripts/fetch-deps.mjs --max 150

      # mps-gradle-plugin <-> MPS / Gradle / Java contract, read from the
      # plugin's and mps-build-backends' sources at each version's commit.
      # See docs/gradle-plugin-compat.md.
      - name: Extract Gradle plugin compatibility
        run: node scripts/extract-gradle-plugin-compat.mjs

      # Never fails the run: findings land in data/assumptions-report.md and
      # the run summary. See docs/reassessment.md.
      - name: Check assumptions
        run: node scripts/check-assumptions.mjs

      - name: Commit if changed
        run: |
          # status, not diff: new files under data/deps are untracked.
          if [ -z "$(git status --porcelain -- versions.json data/ scripts/gradle-plugin-compat.json)" ]; then
            echo "No version changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json data/ scripts/gradle-plugin-compat.json
          git commit -m "data: update MPS library versions ($(date -u +%Y-%m-%d))"
          git push
