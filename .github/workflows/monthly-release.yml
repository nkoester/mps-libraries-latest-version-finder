name: Monthly release

# Publishes one consolidated version list per month.
#
# Besides being useful on its own (a stable, citable snapshot you can pin
# against), this counts as repository activity and keeps the daily scheduled
# workflow from being auto-disabled after 60 days of quiet.

on:
  schedule:
    # 06:00 UTC on the 1st of each month, after the daily fetch has run.
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh data
        run: node scripts/fetch-versions.mjs

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- versions.json data/; then
            echo "No version changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json data/
          git commit -m "data: update MPS library versions ($(date -u +%Y-%m-%d))"
          git push

      - name: Build bundle
        id: bundle
        run: |
          mkdir -p dist
          node scripts/make-bundle.mjs dist >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.bundle.outputs.period }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/${{ steps.bundle.outputs.bundle }}" --clobber
            gh release edit "$tag" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$tag" "dist/${{ steps.bundle.outputs.bundle }}" \
              --title "MPS library versions ${{ steps.bundle.outputs.period }}" \
              --notes-file dist/RELEASE_NOTES.md
          fi
